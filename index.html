<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meow FWT App</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent; /* NUEVO: quita el flash azul al tocar */
    -webkit-touch-callout: none;              /* NUEVO: quita el menú al mantener presionado */
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Menlo', 'Courier New', monospace;
    font-size: 13px;
    -webkit-text-size-adjust: 100%;           /* NUEVO: evita que iOS agrande el texto al rotar */
    overscroll-behavior: none;                 /* NUEVO: bloquea el "pull to refresh" y rebotes */
    touch-action: manipulation;                /* NUEVO: desactiva zoom por doble toque */
    user-select: none;                         /* NUEVO: sin selección accidental */
    -webkit-user-select: none;
  }

  #terminal {
    padding: 12px;
    height: 100vh;
    height: 100dvh;                            /* NUEVO: altura dinámica en iOS (respeta barra Safari) */
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;              /* NUEVO: no propaga el scroll al body */
    touch-action: pan-y;                       /* NUEVO: solo permite scroll vertical */
  }

  #output {
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
    user-select: text;                         /* NUEVO: deja seleccionar texto de la consola */
    -webkit-user-select: text;
  }

  .line { white-space: pre-wrap; }
  .error   { color: #f85149; }
  .success { color: #3fb950; }
  .dim     { color: #8b949e; }
  .warn    { color: #d29922; }
  .progress{ color: #58a6ff; }

  .input-line { display: flex; align-items: center; }

  .input-line span { color: #58a6ff; margin-right: 6px; }

  #cmdInput {
    background: transparent;
    border: none;
    outline: none;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 16px;                           /* NUEVO: 16px evita zoom automático de iOS al enfocar */
    flex: 1;
    caret-color: #58a6ff;
    min-width: 0;
    user-select: text;
    -webkit-user-select: text;
  }

  #preview-box {
    display: none;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 14px;
    margin: 8px 0;
    font-size: 11px;
    line-height: 1.15;
    overflow-x: auto;
    overscroll-behavior: contain;
  }

  .ff-line { display: flex; }
  .ff-art  { white-space: pre; flex-shrink: 0; }
  .ff-info { white-space: pre; }
</style>
</head>
<body>
<div id="terminal">
  <div id="output"></div>
  <div id="preview-box"></div>
  <div class="input-line">
    <span>fastfetch@safari:~$</span>
    <input id="cmdInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
  </div>
</div>

<script>
// ===== WRAPPER GLOBAL PARA CAPTURAR ERRORES =====
window.onerror = function(msg, url, line, col, err) {
  var out = document.getElementById('output');
  if (out) {
    var div = document.createElement('div');
    div.className = 'line error';
    div.textContent = '[ERROR JS] ' + msg + ' (línea ' + line + ')';
    out.appendChild(div);
  }
  return false;
};

'use strict';

// ===== BLOQUEO DE ZOOM Y REBOTES EN iOS (NUEVO) =====

// 1. Bloquear pinch-to-zoom (Safari iOS ignora user-scalable=no)
document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
}, { passive: false });

document.addEventListener('gesturechange', function(e) {
  e.preventDefault();
}, { passive: false });

document.addEventListener('gestureend', function(e) {
  e.preventDefault();
}, { passive: false });

// 2. Bloquear zoom por doble toque
var lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  var now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

// 3. Bloquear zoom con Ctrl + rueda (desktop)
document.addEventListener('wheel', function(e) {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });

// 4. Bloquear el "rebote" elástico del body
document.body.addEventListener('touchmove', function(e) {
  // Solo bloquea si no es dentro de un contenedor scrolleable
  if (!e.target.closest('#terminal') && !e.target.closest('#preview-box')) {
    e.preventDefault();
  }
}, { passive: false });

"                           -+",
"                            -"
].join("\n");

ASCII_ARTS.adelie = [
"                 $3 ,-^-___",
"$3                /\\\\\\///",
"$2refined.$1       /\\\\\\\\//",
"$2reliable.$1     /\\\\\\///",
"$2ready.$1       /\\\\/////\\",
"        __///\\\\\\\\/////\\",
"$3     _//////\\\\\\\\\\\\///",
"$1   ///////$3\\\\\\\\\\\\//",
"          //////$1\\\\\\\\/",
"          /////\\\\\\\\/",
"          /////$3\\\\\\\\/",
"         /\\///\\\\/",
"         /\\\\\\/$1\\\\/",
"         /\\\\\\\\//",
"        //////",
"      /// $3\\\\\\\\\\"
].join("\n");

// ============================================================
// COLORES
// ============================================================
var ANSI_COLORS = {
  '30':'#000000','31':'#cc0000','32':'#4e9a06','33':'#c4a000',
  '34':'#3465a4','35':'#75507b','36':'#06989a','37':'#d3d7cf',
  '90':'#555753','91':'#ef2929','92':'#8ae234','93':'#fce94f',
  '94':'#729fcf','95':'#ad7fa8','96':'#34e2e2','97':'#eeeeec'
};

var LOGO_PALETTE_DEFAULT = ['32','36','33','31','35','34','37','92','96'];

var THEMES = {
  arch:     ['36','34'],
  ubuntu:   ['31','33'],
  mint:     ['32','37'],
  fedora:   ['34','94'],
  opensuse: ['32','92'],
  gentoo:   ['35','95'],
  nixos:    ['34','36','35','31','32','94'],
  popos:    ['36','33'],
  android:  ['32','92'],
  macos:    ['37','31','33','32','36','34']
};

var INFO_STYLE = {
  user:'#8ae234', at:'#d3d7cf', sep:'#555753', label:'#729fcf', value:'#d3d7cf'
};

// ============================================================
// ESTADO
// ============================================================
var STORAGE_KEY = 'fastfetch-web-v03';
var state = {
  ascii: null,
  data: {
    user:'usuario', host:'iPhone', os:'iOS 17.4',
    kernel:'Darwin 23.4.0', uptime:'2 hours, 15 mins',
    shell:'zsh 5.9', terminal:'Safari Web Terminal',
    cpu:'Apple A17 Pro', memory:'8192MiB / 8192MiB'
  },
  customThemes: {}
};

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      ascii: state.ascii, data: state.data, customThemes: state.customThemes
    }));
  } catch(e) {}
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var p = JSON.parse(raw);
    if (p.ascii && ASCII_ARTS[p.ascii]) state.ascii = p.ascii;
    if (p.data) Object.assign(state.data, p.data);
    if (p.customThemes) state.customThemes = p.customThemes;
  } catch(e) {}
}

// ============================================================
// DOM
// ============================================================
var output = document.getElementById('output');
var input = document.getElementById('cmdInput');
var previewBox = document.getElementById('preview-box');

function print(text, cls) {
  var div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.textContent = text;
  output.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

function escapeHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// BUILD
// ============================================================
function getPalette(name) {
  return state.customThemes[name] || THEMES[name] || LOGO_PALETTE_DEFAULT;
}

function stripPlaceholders(s) { return s.replace(/\$\d/g, ''); }

function colorizeLogo(text, palette) {
  var html = escapeHTML(text);
  html = html.replace(/\$(\d)/g, function(m, n) {
    var idx = parseInt(n, 10) - 1;
    var code = palette[idx] || '37';
    var hex = ANSI_COLORS[code] || '#d3d7cf';
    return '</span><span style="color:' + hex + '">';
  });
  return '<span style="color:' + ANSI_COLORS['37'] + '">' + html + '</span>';
}

function infoLine(label, value) {
  return '<span style="color:' + INFO_STYLE.label + '">' + escapeHTML(label) + '</span>' +
         '<span style="color:' + INFO_STYLE.value + '">: ' + escapeHTML(value) + '</span>';
}

function buildFastfetchHTML() {
  var d = state.data;
  var artLines = ASCII_ARTS[state.ascii].split('\n');
  var palette = getPalette(state.ascii);
  var infoLines = [
    '<span style="color:' + INFO_STYLE.user + '">' + escapeHTML(d.user) + '</span>' +
    '<span style="color:' + INFO_STYLE.at + '">@</span>' +
    '<span style="color:' + INFO_STYLE.user + '">' + escapeHTML(d.host) + '</span>',
    '<span style="color:' + INFO_STYLE.sep + '">-------------------</span>',
    infoLine('OS',       d.os),
    infoLine('Host',     d.host),
    infoLine('Kernel',   d.kernel),
    infoLine('Uptime',   d.uptime),
    infoLine('Shell',    d.shell),
    infoLine('Terminal', d.terminal),
    infoLine('CPU',      d.cpu),
    infoLine('Memory',   d.memory)
  ];
  var maxLines = Math.max(artLines.length, infoLines.length);
  var artWidth = 0;
  for (var i = 0; i < artLines.length; i++) {
    var w = stripPlaceholders(artLines[i]).length;
    if (w > artWidth) artWidth = w;
  }
  var html = '';
  for (var j = 0; j < maxLines; j++) {
    var raw = artLines[j] || '';
    var stripped = stripPlaceholders(raw);
    var paddedStripped = stripped + new Array(Math.max(0, artWidth - stripped.length) + 1).join(' ');
    // Reconstruir con placeholders: append padding al final del raw
    var paddedRaw = raw + new Array(Math.max(0, artWidth - stripped.length) + 1).join(' ');
    var coloredArt = colorizeLogo(paddedRaw, palette);
    var info = infoLines[j] || '';
    html += '<div class="ff-line"><span class="ff-art">' + coloredArt + '</span><span class="ff-info">   ' + info + '</span></div>';
  }
  return html;
}

function buildFastfetchPlainText() {
  var d = state.data;
  var artLines = ASCII_ARTS[state.ascii].split('\n').map(stripPlaceholders);
  var infoLines = [
    d.user + '@' + d.host,
    '-------------------',
    'OS: '       + d.os,
    'Host: '     + d.host,
    'Kernel: '   + d.kernel,
    'Uptime: '   + d.uptime,
    'Shell: '    + d.shell,
    'Terminal: ' + d.terminal,
    'CPU: '      + d.cpu,
    'Memory: '   + d.memory
  ];
  var maxLines = Math.max(artLines.length, infoLines.length);
  var artWidth = 0;
  for (var i = 0; i < artLines.length; i++) {
    if (artLines[i].length > artWidth) artWidth = artLines[i].length;
  }
  var out = '';
  for (var j = 0; j < maxLines; j++) {
    var a = (artLines[j] || '');
    var pad = new Array(Math.max(0, artWidth - a.length) + 1).join(' ');
    out += (a + pad) + '   ' + (infoLines[j] || '') + '\n';
  }
  return out;
}

function renderPreview() {
  previewBox.innerHTML = buildFastfetchHTML();
  previewBox.style.display = 'block';
}

// ============================================================
// COMANDOS
// ============================================================
var commands = {};

commands.help = function() {
  print('Comandos disponibles:', 'dim');
  print('  help                          - Muestra esta ayuda');
  print('  list-ascii                    - Lista los ASCII disponibles');
  print('  download <nombre>             - "Descarga" un ASCII');
  print('  set <campo> <valor>           - Configura un dato');
  print('  fields                        - Lista los campos configurables');
  print('  preview                       - Previsualiza el resultado');
  print('  theme                         - Ver temas configurados');
  print('  theme <ascii> <c1> [c2...]    - Cambiar paleta de un ASCII');
  print('  theme reset <ascii>           - Resetear paleta de un ASCII');
  print('  export png|txt|pdf            - Exporta el resultado');
  print('  save                          - Guardar config');
  print('  reset                         - Borrar config guardada');
  print('  clear                         - Limpia la terminal');
};

commands['list-ascii'] = function() {
  print('ASCII disponibles:', 'dim');
  Object.keys(ASCII_ARTS).forEach(function(k) { print('  • ' + k); });
  print('Usa: download <nombre>', 'dim');
};

commands.download = function(args) {
  var name = args[0];
  if (!name) return print('Uso: download <nombre>', 'error');
  if (!ASCII_ARTS[name]) return print('ASCII "' + name + '" no encontrado. Prueba list-ascii.', 'error');

  print('Conectando al repositorio fastfetch-web...', 'dim');
  print('Descargando ' + name + '...');

  var bar = document.createElement('div');
  bar.className = 'line progress';
  output.appendChild(bar);

  var pct = 0;
  var interval = setInterval(function() {
    pct += 4;
    if (pct > 100) pct = 100;
    var filled = Math.round(pct / 5);
    var empty = 20 - filled;
    var filledStr = new Array(filled + 1).join('█');
    var emptyStr = new Array(empty + 1).join('░');
    var speed = (Math.random() * 4 + 1).toFixed(1);
    bar.textContent = '  [' + filledStr + emptyStr + '] ' + Math.round(pct) + '%  ' + speed + ' MB/s';
    window.scrollTo(0, document.body.scrollHeight);
    if (pct >= 100) {
      clearInterval(interval);
      state.ascii = name;
      saveState();
      print('✓ ' + name + ' descargado correctamente.', 'success');
    }
  }, 60);
};

commands.fields = function() {
  print('Campos configurables (set <campo> <valor>):', 'dim');
  Object.keys(state.data).forEach(function(k) { print('  • ' + k); });
};

commands.set = function(args) {
  var key = args[0];
  var value = args.slice(1).join(' ');
  if (!key || !value) return print('Uso: set <campo> <valor>', 'error');
  if (!(key in state.data)) return print('Campo "' + key + '" no existe. Usa fields.', 'error');
  state.data[key] = value;
  saveState();
  print('✓ ' + key + ' = ' + value, 'success');
};

commands.preview = function() {
  if (!state.ascii) return print('Primero descarga un ASCII: download <nombre>', 'error');
  renderPreview();
  print('Previsualización generada abajo ↓', 'dim');
};

commands.theme = function(args) {
  if (args.length === 0) {
    print('Temas configurados:', 'dim');
    Object.keys(ASCII_ARTS).forEach(function(name) {
      var pal = getPalette(name);
      var src = state.customThemes[name] ? 'custom' : (THEMES[name] ? 'default' : 'fallback');
      print('  • ' + (name + '            ').slice(0, 12) + ' [' + pal.join(', ') + ']  (' + src + ')');
    });
    print('', 'dim');
    print('Cambiar:  theme <ascii> <c1> [c2...]', 'dim');
    print('Resetear: theme reset <ascii>', 'dim');
    print('Colores: 30-37 (normal), 90-97 (brillante)', 'dim');
    return;
  }
  if (args[0] === 'reset') {
    var n = args[1];
    if (!n || !ASCII_ARTS[n]) return print('Uso: theme reset <ascii>', 'error');
    delete state.customThemes[n];
    saveState();
    print('✓ Tema de ' + n + ' reseteado.', 'success');
    return;
  }
  var name = args[0];
  var colors = args.slice(1);
  if (!ASCII_ARTS[name]) return print('ASCII "' + name + '" no existe.', 'error');
  if (colors.length === 0) return print('Uso: theme <ascii> <c1> [c2...]', 'error');
  for (var i = 0; i < colors.length; i++) {
    if (!/^(3[0-7]|9[0-7])$/.test(colors[i])) return print('Color inválido: ' + colors[i] + '. Usa 30-37 o 90-97.', 'error');
  }
  state.customThemes[name] = colors;
  saveState();
  print('✓ Tema de ' + name + ' actualizado: [' + colors.join(', ') + ']', 'success');
};

commands.save = function() { saveState(); print('✓ Configuración guardada.', 'success'); };

commands.reset = function() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  state.ascii = null;
  state.customThemes = {};
  state.data = {
    user:'usuario', host:'iPhone', os:'iOS 17.4',
    kernel:'Darwin 23.4.0', uptime:'2 hours, 15 mins',
    shell:'zsh 5.9', terminal:'Safari Web Terminal',
    cpu:'Apple A17 Pro', memory:'8192MiB / 8192MiB'
  };
  previewBox.style.display = 'none';
  print('✓ Configuración borrada.', 'success');
};

commands.export = function(args) {
  var type = args[0];
  if (!state.ascii) return print('Primero descarga un ASCII y haz preview.', 'error');
  if (['png','txt','pdf'].indexOf(type) === -1) return print('Uso: export png|txt|pdf', 'error');
  renderPreview();
  setTimeout(function() {
    if (type === 'txt') exportTxt();
    if (type === 'png') exportPng();
    if (type === 'pdf') exportPdf();
  }, 100);
};

commands.clear = function() {
  output.innerHTML = '';
  previewBox.style.display = 'none';
};

// ============================================================
// EXPORTS
// ============================================================
function exportTxt() {
  var text = buildFastfetchPlainText();
  downloadBlob(new Blob([text], {type:'text/plain'}), 'fastfetch.txt');
  print('✓ fastfetch.txt descargado', 'success');
}
function exportPng() {
  if (typeof html2canvas !== 'function') {
    return print('html2canvas no cargó. Revisa tu conexión.', 'error');
  }
  html2canvas(previewBox, { backgroundColor: '#161b22', scale: 2 }).then(function(canvas) {
    canvas.toBlob(function(blob) {
      downloadBlob(blob, 'fastfetch.png');
      print('✓ fastfetch.png descargado', 'success');
    });
  }).catch(function(e) {
    print('Error al generar PNG: ' + e.message, 'error');
  });
}
function exportPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    return print('jsPDF no cargó. Revisa tu conexión.', 'error');
  }
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit:'pt', format:'a4' });
  doc.setFont('courier', 'normal');
  doc.setFontSize(9);
  var text = buildFastfetchPlainText();
  var lines = doc.splitTextToSize(text, 540);
  doc.text(lines, 30, 40);
  doc.save('fastfetch.pdf');
  print('✓ fastfetch.pdf descargado', 'success');
}
function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

// ============================================================
// INPUT HANDLING (robusto para iOS)
// ============================================================
function handleCommand(raw) {
  raw = raw.trim();
  if (!raw) return;
  print('fastfetch@safari:~$ ' + raw);
  var parts = raw.split(/\s+/);
  var cmd = parts[0];
  var args = parts.slice(1);
  if (commands[cmd]) {
    try { commands[cmd](args); }
    catch (err) { print('Error: ' + err.message, 'error'); }
  } else {
    print('comando no encontrado: ' + cmd + ". Escribe 'help'.", 'error');
  }
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) {
    e.preventDefault();
    var val = input.value;
    input.value = '';
    handleCommand(val);
  }
});

// Tocar la terminal enfoca el input (iOS)
document.getElementById('terminal').addEventListener('touchstart', function(e) {
  if (e.target.tagName !== 'INPUT') {
    setTimeout(function() { input.focus(); }, 50);
  }
}, { passive: true });
document.getElementById('terminal').addEventListener('click', function(e) {
  if (e.target.tagName !== 'INPUT') input.focus();
});

// ============================================================
// INIT
// ============================================================
loadState();
print('fastfetch-web-terminal v0.3', 'success');
print('Escribe "help" para ver los comandos.', 'dim');
if (state.ascii) print('(config restaurada: ASCII "' + state.ascii + '")', 'dim');
print('');

// Enfocar input al cargar
setTimeout(function() { input.focus(); }, 300);

})();
</script>
