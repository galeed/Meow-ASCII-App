<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>Meow FWT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0d1117; color: #c9d1d9;
    font-family: 'Menlo', 'Courier New', monospace;
    font-size: 13px;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #terminal {
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) 12px;
    height: 100vh; height: 100dvh;
    overflow-y: auto; display: flex; flex-direction: column;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  #output { white-space: pre-wrap; word-break: break-word; flex: 1; user-select: text; -webkit-user-select: text; }
  .line { white-space: pre-wrap; }
  .error { color: #f85149; } .success { color: #3fb950; } .dim { color: #8b949e; }
  .warn { color: #d29922; } .progress { color: #58a6ff; } .cyan { color: #34e2e2; }
  
  .input-line { display: flex; align-items: center; }
  .input-line span { color: #58a6ff; margin-right: 6px; flex-shrink: 0; }
  
  #cmdInput {
    background: transparent; border: none; outline: none;
    color: #c9d1d9; font-family: inherit;
    font-size: 16px; transform: scale(0.8125); transform-origin: left center;
    flex: 1; caret-color: #58a6ff; min-width: 0;
    user-select: text; -webkit-user-select: text;
  }

  .hist-btns { display: flex; flex-direction: column; gap: 2px; margin-left: 8px; }
  .hist-btns button {
    background: #161b22; border: 1px solid #30363d; color: #8b949e;
    border-radius: 4px; width: 24px; height: 20px; font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    padding: 0; outline: none;
  }
  .hist-btns button:active { background: #30363d; color: #c9d1d9; }

  #preview-box {
    display: none; background: #161b22; border: 1px solid #30363d;
    border-radius: 6px; padding: 14px; margin: 8px 0;
    font-size: 11px; line-height: 1.15; overflow-x: auto;
    overscroll-behavior: contain;
  }
  .ff-line { display: flex; }
  .ff-art { white-space: pre; flex-shrink: 0; }
  .ff-info { white-space: pre; }

  /* Estilos para utilidades visuales */
  .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 8px 0; max-width: 300px; }
  .color-swatch { padding: 4px; text-align: center; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }
  .qr-container { background: #fff; padding: 10px; display: inline-block; margin: 8px 0; border-radius: 6px; }
</style>
</head>
<body>
<div id="terminal">
  <div id="output"></div>
  <div id="preview-box"></div>
  <div class="input-line">
    <span id="promptText">meow@fwt:~$</span>
    <input id="cmdInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <div class="hist-btns">
      <button id="btnUp" tabindex="-1">↑</button>
      <button id="btnDown" tabindex="-1">↓</button>
    </div>
  </div>
</div>

<script>
window.onerror = function(msg, url, line, col, err) {
  var out = document.getElementById('output');
  if (out) {
    var div = document.createElement('div');
    div.className = 'line error';
    div.textContent = '[ERROR JS] ' + msg + ' (línea ' + line + ')';
    out.appendChild(div);
  }
  return false;
};

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      Object.assign(state, p);
      if (state.prompt) document.getElementById('promptText').textContent = state.prompt;
    }
  } catch(e) {}
}

function escapeHTML(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function beep() { if (state.sound && !state.liteMode) { try { var ctx = new (window.AudioContext||window.webkitAudioContext)(); var o = ctx.createOscillator(); o.connect(ctx.destination); o.frequency.value = 800; o.start(); o.stop(ctx.currentTime + 0.05); } catch(e){} } }

// ============================================================
// BUILD LOGIC
// ============================================================
function getPalette(name) { return state.customThemes[name] || THEMES[name] || LOGO_PALETTE_DEFAULT; }
function stripPlaceholders(s) { return s.replace(/\$\d/g, ''); }

function colorizeLogo(text, palette) {
  var html = escapeHTML(text);
  html = html.replace(/\$(\d)/g, function(m, n) {
    var idx = parseInt(n, 10) - 1;
    var code = palette[idx] || '37';
    return '</span><span style="color:' + (ANSI_COLORS[code] || '#d3d7cf') + '">';
  });
  return '<span style="color:' + ANSI_COLORS['37'] + '">' + html + '</span>';
}
function infoLine(label, value) { return '<span style="color:' + INFO_STYLE.label + '">' + escapeHTML(label) + '</span><span style="color:' + INFO_STYLE.value + '">: ' + escapeHTML(value) + '</span>'; }

function getInfoLines(compact) {
  var d = state.data;
  var base = [
    '<span style="color:' + INFO_STYLE.user + '">' + escapeHTML(d.user) + '</span><span style="color:' + INFO_STYLE.at + '">@</span><span style="color:' + INFO_STYLE.user + '">' + escapeHTML(d.host) + '</span>',
    '<span style="color:' + INFO_STYLE.sep + '">-------------------</span>'
  ];
  if (compact) {
    return base.concat([ infoLine('OS', d.os), infoLine('Host', d.host), infoLine('Uptime', d.uptime), infoLine('Shell', d.shell) ]);
  }
  return base.concat([
    infoLine('OS', d.os), infoLine('Host', d.host), infoLine('Kernel', d.kernel), infoLine('Uptime', d.uptime),
    infoLine('Shell', d.shell), infoLine('Terminal', d.terminal), infoLine('CPU', d.cpu), infoLine('Memory', d.memory)
  ]);
}

function buildFastfetchHTML(asciiName, compact, noInfo) {
  var artLines = ASCII_ARTS[asciiName].split('\n');
  var palette = getPalette(asciiName);
  var infoLines = noInfo ? [] : getInfoLines(compact);
  var maxLines = Math.max(artLines.length, infoLines.length);
  var artWidth = 0;
  for (var i = 0; i < artLines.length; i++) { var w = stripPlaceholders(artLines[i]).length; if (w > artWidth) artWidth = w; }
  var html = '';
  for (var j = 0; j < maxLines; j++) {
    var raw = artLines[j] || '';
    var stripped = stripPlaceholders(raw);
    var paddedRaw = raw + new Array(Math.max(0, artWidth - stripped.length) + 1).join(' ');
    var coloredArt = colorizeLogo(paddedRaw, palette);
    var info = infoLines[j] || '';
    html += '<div class="ff-line"><span class="ff-art">' + coloredArt + '</span><span class="ff-info">   ' + info + '</span></div>';
  }
  return html;
}

function buildFastfetchPlainText() {
  var d = state.data;
  var artLines = ASCII_ARTS[state.ascii].split('\n').map(stripPlaceholders);
  var infoLines = [ d.user + '@' + d.host, '-------------------', 'OS: '+d.os, 'Host: '+d.host, 'Kernel: '+d.kernel, 'Uptime: '+d.uptime, 'Shell: '+d.shell, 'Terminal: '+d.terminal, 'CPU: '+d.cpu, 'Memory: '+d.memory ];
  var maxLines = Math.max(artLines.length, infoLines.length);
  var artWidth = 0;
  for (var i = 0; i < artLines.length; i++) { if (artLines[i].length > artWidth) artWidth = artLines[i].length; }
  var out = '';
  for (var j = 0; j < maxLines; j++) {
    var a = (artLines[j] || '');
    var pad = new Array(Math.max(0, artWidth - a.length) + 1).join(' ');
    out += (a + pad) + '   ' + (infoLines[j] || '') + '\n';
  }
  return out;
}

commands.set = function(args) {
  if (args[0] === '--interactive') {
    var keys = Object.keys(state.data); var i = 0;
    function askNext() {
      if (i >= keys.length) { saveState(); print('✓ Configuración guardada.', 'success'); return; }
      var k = keys[i];
      print('Valor para ' + k + ' (Enter para mantener "' + state.data[k] + '"):', 'warn');
      var handler = function(e) {
        if (e.key === 'Enter') {
          input.removeEventListener('keydown', handler);
          var v = input.value; input.value = ''; print(v);
          if (v.trim()) state.data[k] = v.trim();
          i++; askNext();
        }
      };
      input.addEventListener('keydown', handler);
    }
    askNext();
    return;
  }
  if (args[0] === 'prefix') {
    var txt = args.slice(1).join(' ');
    if (!txt) return print('Uso: set prefix "<texto>"', 'error');
    state.prompt = txt; document.getElementById('promptText').textContent = txt; saveState();
    print('✓ Prompt cambiado a: ' + txt, 'success'); return;
  }
  var key = args[0]; var value = args.slice(1).join(' ');
  if (!key || !value) return print('Uso: set <campo> <valor>', 'error');
  if (!(key in state.data)) return print('Campo "' + key + '" no existe.', 'error');
  state.data[key] = value; saveState(); print('✓ ' + key + ' = ' + value, 'success');
};

commands.theme = function(args) {
  if (args.length === 0) {
    print('Temas configurados:', 'dim');
    Object.keys(ASCII_ARTS).forEach(function(name) {
      var pal = getPalette(name); var src = state.customThemes[name] ? 'custom' : (THEMES[name] ? 'default' : 'fallback');
      print('  • ' + (name + '            ').slice(0, 12) + ' [' + pal.join(', ') + '] (' + src + ')');
    });
    return;
  }
  if (args[0] === 'picker') {
    print('Selecciona un color (toca el número):', 'dim');
    var html = '<div class="color-grid">';
    for (var i = 30; i <= 37; i++) html += '<div class="color-swatch" style="background:'+ANSI_COLORS[i]+'; color:'+(i>33?'#000':'#fff')+'" onclick="window.setSwatch(\''+i+'\')">'+i+'<br>'+COLOR_NAMES[i-30]+'</div>';
    for (var j = 90; j <= 97; j++) html += '<div class="color-swatch" style="background:'+ANSI_COLORS[j]+'; color:'+(j>93?'#000':'#fff')+'" onclick="window.setSwatch(\''+j+'\')">'+j+'<br>'+COLOR_NAMES[j-90+8]+'</div>';
    html += '</div><div class="dim">Usa: theme ' + (state.ascii || 'arch') + ' <num1> <num2>...</div>';
    printHTML(html);
    return;
  }
  if (args[0] === 'rainbow') {
    var name = args[1] || state.ascii;
    if (!name || !ASCII_ARTS[name]) return print('Uso: theme rainbow <ascii>', 'error');
    var rainbow = ['31','33','32','36','34','35','91','93','92','96','94','95'];
    var colors = [];
    var placeholders = ASCII_ARTS[name].match(/\$\d/g) || [];
    var maxP = 0; placeholders.forEach(function(p){ var n=parseInt(p[1]); if(n>maxP)maxP=n; });
    for(var i=0;i<maxP;i++) colors.push(rainbow[i % rainbow.length]);
    state.customThemes[name] = colors; saveState();
    print('✓ Tema rainbow aplicado a ' + name, 'success'); return;
  }
  if (args[0] === 'reset') {
    delete state.customThemes[args[1]]; saveState(); print('✓ Tema reseteado.', 'success'); return;
  }
  var name = args[0]; var colors = args.slice(1);
  if (!ASCII_ARTS[name] || colors.length === 0) return print('Uso: theme <ascii> <c1> [c2...]', 'error');
  state.customThemes[name] = colors; saveState(); print('✓ Tema actualizado.', 'success');
};

};

commands.sudo = function(args) {
  if (args[0] === 'rm' && args[1] === '-rf' && args[2] === '/') return print('Nice try 😏', 'warn');
  if (args[0] !== 'meow') return print('sudo: comando no permitido. Usa "sudo meow" o solo "meow".', 'error');
  var action = args[1]; var rest = args.slice(2);
  if (!action) return print('¿Meow? 🐱 Acciones: add, gen, list, status, save, load, presets, remove, backup, restore, preset, diff', 'dim');

  if (action === 'add') {
    var name = rest[0];
    if (name === 'random') { var keys = Object.keys(ASCII_ARTS); name = keys[Math.floor(Math.random()*keys.length)]; print('Aleatorio: ' + name, 'success'); }
    if (!ASCII_ARTS[name]) return print('ASCII no existe.', 'error');
    print('[sudo] Descargando ' + name + '...', 'dim');
    var bar = document.createElement('div'); bar.className = 'line progress'; output.appendChild(bar);
    var pct = 0; var intv = setInterval(function() {
      pct += 20; if (pct > 100) pct = 100;
      bar.textContent = '  [' + new Array(Math.round(pct/5)+1).join('█') + new Array(20-Math.round(pct/5)+1).join('░') + '] ' + Math.round(pct) + '%';
      window.scrollTo(0, document.body.scrollHeight);
      if (pct >= 100) { clearInterval(intv); state.ascii = name; if (state.installed.indexOf(name)===-1) state.installed.push(name); saveState(); print('✓ Instalado.', 'success'); beep(); }
    }, 30);
    return;
  }
  if (action === 'gen') {
    var type = rest[0]; if (!type) return print('Uso: gen <txt|png|pdf>', 'error');
    if (!state.ascii) return print('No hay ASCII cargado.', 'error');
    print('[sudo] Generando ' + type + '...', 'dim'); renderPreview();
    setTimeout(function(){ if(type==='txt')exportTxt(); if(type==='png')exportPng(); if(type==='pdf')exportPdf(); }, 300);
    return;
  }
  if (action === 'list') { if(!state.installed.length)return print('No hay instalados.','warn'); print('Instalados:','dim'); state.installed.forEach(function(k){ print('  • '+k+(k===state.ascii?' (activo)':'')); }); return; }
  if (action === 'status') { if(!state.ascii)return print('Ningún ASCII activo.','warn'); print('Activo: ' + state.ascii, 'success'); return; }
  
  if (action === 'save') {
    var pName = rest[0]; if(!pName)return print('Uso: save <nombre>','error');
    state.presets[pName] = { ascii: state.ascii, data: JSON.parse(JSON.stringify(state.data)), customThemes: JSON.parse(JSON.stringify(state.customThemes)) };
    saveState(); print('✓ Preset guardado: ' + pName, 'success'); return;
  }
  if (action === 'load') {
    var pName = rest[0]; if(!state.presets[pName])return print('Preset no encontrado.','error');
    Object.assign(state, state.presets[pName]); saveState(); print('✓ Preset cargado.','success'); commands.fastfetch(); return;
  }
  if (action === 'presets') {
    var keys = Object.keys(state.presets); if(!keys.length)return print('No hay presets.','warn');
    keys.forEach(function(k){ print('  • '+k+' (ASCII: '+state.presets[k].ascii+')'); }); return;
  }
  if (action === 'remove') {
    var n = rest[0]; var idx = state.installed.indexOf(n);
    if(idx>-1){ state.installed.splice(idx,1); saveState(); print('✓ Removido: '+n,'success'); } else print('No instalado.','error'); return;
  }
  if (action === 'backup') {
    var dataStr = JSON.stringify(state);
    downloadBlob(new Blob([dataStr], {type:'application/json'}), 'meow-backup.json');
    print('✓ Backup descargado.', 'success'); return;
  }
  if (action === 'restore') {
    print('Pega el JSON de backup en el input y presiona Enter.', 'warn');
    var handler = function(e) {
      if (e.key === 'Enter') {
        input.removeEventListener('keydown', handler);
        try { var p = JSON.parse(input.value); Object.assign(state, p); saveState(); print('✓ Restaurado.','success'); location.reload(); } 
        catch(err) { print('JSON inválido.', 'error'); }
        input.value = '';
      }
    };
    input.addEventListener('keydown', handler); return;
  }
  if (action === 'preset') {
    if (rest[0]==='rename') {
      var o = rest[1], n = rest[2];
      if(state.presets[o]) { state.presets[n]=state.presets[o]; delete state.presets[o]; saveState(); print('✓ Renombrado.','success'); }
      else print('No existe el preset.','error');
    }
    return;
  }
  if (action === 'diff') {
    var p1 = state.presets[rest[0]], p2 = state.presets[rest[1]];
    if(!p1||!p2)return print('Presets no encontrados.','error');
    print('Diferencias:', 'dim');
    Object.keys(p1.data).forEach(function(k){ if(p1.data[k]!==p2.data[k]) print('  ' + k + ': "'+p1.data[k]+'" -> "'+p2.data[k]+'"', 'warn'); });
    return;
  }
  print('Acción no reconocida.', 'error');
};

// ============================================================
// TYPEWRITER
// ============================================================
function typewriterPrint(html, cls, callback) {
  if (state.liteMode || !html) { printHTML(html); if(callback)callback(); return; }
  var div = document.createElement('div'); div.className = 'line ' + (cls || ''); output.appendChild(div);
  var temp = document.createElement('div'); temp.innerHTML = html;
  var nodes = Array.from(temp.childNodes); var nodeIndex = 0, charIndex = 0;
  function processNextNode() {
    if (nodeIndex >= nodes.length) { if(callback)callback(); return; }
    var node = nodes[nodeIndex];
    if (node.nodeType === 3) {
      if (charIndex < node.textContent.length) { div.appendChild(document.createTextNode(node.textContent[charIndex])); charIndex++; window.scrollTo(0,document.body.scrollHeight); setTimeout(processNextNode, 1); }
      else { nodeIndex++; charIndex = 0; processNextNode(); }
    } else {
      var clone = node.cloneNode(false); div.appendChild(clone);
      var spanText = node.textContent;
      if (spanText.length > 0) {
        var spanChar = 0;
        function processSpan() {
          if (spanChar < spanText.length) { clone.textContent += spanText[spanChar]; spanChar++; window.scrollTo(0,document.body.scrollHeight); setTimeout(processSpan, 1); }
          else { nodeIndex++; charIndex = 0; processNextNode(); }
        }
        processSpan();
      } else { nodeIndex++; processNextNode(); }
    }
  }
  processNextNode();
}

// ============================================================
// INPUT HANDLING
// ============================================================
function autocomplete() {
  var val = input.value; var parts = val.split(/\s+/);
  if (parts.length === 1) {
    var matches = Object.keys(commands).filter(function(c){return c.indexOf(parts[0])===0;});
    if (matches.length === 1) input.value = matches[0] + ' ';
    else if (matches.length > 1) print(matches.join(', '), 'dim');
    return;
  }
  if (parts[0] === 'sudo' && parts[1] === 'meow' && parts.length <= 3) {
    var acts = ['add','gen','list','status','save','load','presets','remove','backup','restore','preset','diff'];
    if (parts.length === 3 && parts[2] !== '') { var m = acts.filter(function(a){return a.indexOf(parts[2])===0;}); if(m.length===1)input.value='sudo meow '+m[0]+' '; else print(m.join(', '),'dim'); }
    else print('Acciones: ' + acts.join(', '), 'dim');
    return;
  }
  if (parts[0] === 'meow' && parts.length <= 2) {
    var acts = ['add','gen','list','status','save','load','presets','remove','backup','restore'];
    if (parts.length === 2 && parts[1] !== '') { var m = acts.filter(function(a){return a.indexOf(parts[1])===0;}); if(m.length===1)input.value='meow '+m[0]+' '; else print(m.join(', '),'dim'); }
    else print('Acciones: ' + acts.join(', '), 'dim');
    return;
  }
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Tab') { e.preventDefault(); autocomplete(); return; }
  if (e.key === 'Enter' || e.keyCode === 13) {
    e.preventDefault(); var val = input.value; input.value = '';
    if (val.trim()) { history.push(val.trim()); if(history.length>50)history.shift(); localStorage.setItem('meow-fwt-history', JSON.stringify(history)); histIndex = history.length; }
    handleCommand(val);
  }
  if (e.key === 'ArrowUp') { e.preventDefault(); if(histIndex>0){histIndex--;input.value=history[histIndex];} }
  if (e.key === 'ArrowDown') { e.preventDefault(); if(histIndex<history.length-1){histIndex++;input.value=history[histIndex];} else {histIndex=history.length;input.value='';} }
});

document.getElementById('btnUp').addEventListener('click', function(e) { e.preventDefault(); if(histIndex>0){histIndex--;input.value=history[histIndex];} });
document.getElementById('btnDown').addEventListener('click', function(e) { e.preventDefault(); if(histIndex<history.length-1){histIndex++;input.value=history[histIndex];} else {histIndex=history.length;input.value='';} });

function handleCommand(raw) {
  raw = raw.trim(); if (!raw) return;
  print(document.getElementById('promptText').textContent + ' ' + raw);
  var parts = raw.split(/\s+/); var cmd = parts[0]; var args = parts.slice(1);
  haptic();
  if (commands[cmd]) { try { commands[cmd](args); beep(); } catch (err) { print('Error: ' + err.message, 'error'); } }
  else print('comando no encontrado: ' + cmd + ". Escribe 'help'.", 'error');
}
