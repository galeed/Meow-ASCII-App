<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>fastfetch-web-terminal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0d1117; color: #c9d1d9;
    font-family: 'Menlo', 'Courier New', monospace;
    font-size: 13px;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #terminal {
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) 12px;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  #output {
    white-space: pre-wrap; word-break: break-word; flex: 1;
    user-select: text; -webkit-user-select: text;
  }
  .line { white-space: pre-wrap; }
  .error { color: #f85149; }
  .success { color: #3fb950; }
  .dim { color: #8b949e; }
  .warn { color: #d29922; }
  .progress { color: #58a6ff; }
  .input-line { display: flex; align-items: center; }
  .input-line span { color: #58a6ff; margin-right: 6px; flex-shrink: 0; }
  #cmdInput {
    background: transparent; border: none; outline: none;
    color: #c9d1d9; font-family: inherit;
    font-size: 16px; transform: scale(0.8125); transform-origin: left center;
    flex: 1; caret-color: #58a6ff; min-width: 0;
    user-select: text; -webkit-user-select: text;
  }
  #preview-box {
    display: none; background: #161b22; border: 1px solid #30363d;
    border-radius: 6px; padding: 14px; margin: 8px 0;
    font-size: 11px; line-height: 1.15; overflow-x: auto;
    overscroll-behavior: contain;
  }
  .ff-line { display: flex; }
  .ff-art { white-space: pre; flex-shrink: 0; }
  .ff-info { white-space: pre; }
</style>
</head>
<body>
<div id="terminal">
  <div id="output"></div>
  <div id="preview-box"></div>
  <div class="input-line">
    <span>fastfetch@safari:~$</span>
    <input id="cmdInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
  </div>
</div>

<script>
window.onerror = function(msg, url, line, col, err) {
  var out = document.getElementById('output');
  if (out) {
    var div = document.createElement('div');
    div.className = 'line error';
    div.textContent = '[ERROR JS] ' + msg + ' (línea ' + line + ')';
    out.appendChild(div);
  }
  return false;
};

      ascii: state.ascii, installed: state.installed, data: state.data, customThemes: state.customThemes
    }));
  } catch(e) {}
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var p = JSON.parse(raw);
    if (p.ascii && ASCII_ARTS[p.ascii]) state.ascii = p.ascii;
    if (p.installed) state.installed = p.installed;
    if (p.data) Object.assign(state.data, p.data);
    if (p.customThemes) state.customThemes = p.customThemes;
  } catch(e) {}
}
