<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>fastfetch-web-terminal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0d1117; color: #c9d1d9;
    font-family: 'Menlo', 'Courier New', monospace;
    font-size: 13px;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #terminal {
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) 12px;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  #output {
    white-space: pre-wrap; word-break: break-word; flex: 1;
    user-select: text; -webkit-user-select: text;
  }
  .line { white-space: pre-wrap; }
  .error { color: #f85149; }
  .success { color: #3fb950; }
  .dim { color: #8b949e; }
  .warn { color: #d29922; }
  .progress { color: #58a6ff; }
  
  .input-line { display: flex; align-items: center; }
  .input-line span { color: #58a6ff; margin-right: 6px; flex-shrink: 0; }
  
  #cmdInput {
    background: transparent; border: none; outline: none;
    color: #c9d1d9; font-family: inherit;
    font-size: 16px; transform: scale(0.8125); transform-origin: left center;
    flex: 1; caret-color: #58a6ff; min-width: 0;
    user-select: text; -webkit-user-select: text;
  }

  .hist-btns {
    display: flex; flex-direction: column; gap: 2px; margin-left: 8px;
  }
  .hist-btns button {
    background: #161b22; border: 1px solid #30363d; color: #8b949e;
    border-radius: 4px; width: 24px; height: 20px; font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    padding: 0; outline: none;
  }
  .hist-btns button:active { background: #30363d; color: #c9d1d9; }

  #preview-box {
    display: none; background: #161b22; border: 1px solid #30363d;
    border-radius: 6px; padding: 14px; margin: 8px 0;
    font-size: 11px; line-height: 1.15; overflow-x: auto;
    overscroll-behavior: contain;
  }
  .ff-line { display: flex; }
  .ff-art { white-space: pre; flex-shrink: 0; }
  .ff-info { white-space: pre; }
</style>
</head>
<body>
<div id="terminal">
  <div id="output"></div>
  <div id="preview-box"></div>
  <div class="input-line">
    <span>fastfetch@safari:~$</span>
    <input id="cmdInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <div class="hist-btns">
      <button id="btnUp" tabindex="-1">↑</button>
      <button id="btnDown" tabindex="-1">↓</button>
    </div>
  </div>
</div>

<script>
window.onerror = function(msg, url, line, col, err) {
  var out = document.getElementById('output');
  if (out) {
    var div = document.createElement('div');
    div.className = 'line error';
    div.textContent = '[ERROR JS] ' + msg + ' (línea ' + line + ')';
    out.appendChild(div);
  }
  return false;
};

document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
var lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  var now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();

}, { passive: false });
document.addEventListener('wheel', function(e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

function print(text, cls) {
  var div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.textContent = text;
  output.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

function escapeHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// NUEVO: Efecto Typewriter
function typewriterPrint(html, cls, callback) {
  if (!state.typewriter || !html) {
    var div = document.createElement('div');
    div.className = 'line ' + (cls || '');
    div.innerHTML = html;
    output.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
    if (callback) callback();
    return;
  }

  var div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  output.appendChild(div);
  
  // Parsear el HTML para animar por nodos de texto
  var temp = document.createElement('div');
  temp.innerHTML = html;
  var nodes = Array.from(temp.childNodes);
  var nodeIndex = 0;
  var charIndex = 0;
  
  function processNextNode() {
    if (nodeIndex >= nodes.length) {
      if (callback) callback();
      return;
    }
    var node = nodes[nodeIndex];
    if (node.nodeType === 3) { // Text node
      if (charIndex < node.textContent.length) {
        div.appendChild(document.createTextNode(node.textContent[charIndex]));
        charIndex++;
        window.scrollTo(0, document.body.scrollHeight);
        setTimeout(processNextNode, 1); // velocidad
      } else {
        nodeIndex++;
        charIndex = 0;
        processNextNode();
      }
    } else { // Element node (span)
      var clone = node.cloneNode(false);
      div.appendChild(clone);
      // Animamos el texto dentro del span recursivamente
      var spanText = node.textContent;
      if (spanText.length > 0) {
        var spanChar = 0;
        function processSpan() {
          if (spanChar < spanText.length) {
            clone.textContent += spanText[spanChar];
            spanChar++;
            window.scrollTo(0, document.body.scrollHeight);
            setTimeout(processSpan, 1);
          } else {
            nodeIndex++;
            charIndex = 0;
            processNextNode();
          }
        }
        processSpan();
      } else {
        nodeIndex++;
        processNextNode();
      }
    }
  }
  processNextNode();
}

function getPalette(name) { return state.customThemes[name] || THEMES[name] || LOGO_PALETTE_DEFAULT; }
function stripPlaceholders(s) { return s.replace(/\$\d/g, ''); }

function colorizeLogo(text, palette) {
  var html = escapeHTML(text);
  html = html.replace(/\$(\d)/g, function(m, n) {
    var idx = parseInt(n, 10) - 1;
    var code = palette[idx] || '37';
    var hex = ANSI_COLORS[code] || '#d3d7cf';
    return '</span><span style="color:' + hex + '">';
  });
  return '<span style="color:' + ANSI_COLORS['37'] + '">' + html + '</span>';
}

function infoLine(label, value) {
  return '<span style="color:' + INFO_STYLE.label + '">' + escapeHTML(label) + '</span>' +
         '<span style="color:' + INFO_STYLE.value + '">: ' + escapeHTML(value) + '</span>';
}

function getInfoLines() {
  var d = state.data;
  return [
    '<span style="color:' + INFO_STYLE.user + '">' + escapeHTML(d.user) + '</span>' +
    '<span style="color:' + INFO_STYLE.at + '">@</span>' +
    '<span style="color:' + INFO_STYLE.user + '">' + escapeHTML(d.host) + '</span>',
    '<span style="color:' + INFO_STYLE.sep + '">-------------------</span>',
    infoLine('OS', d.os), infoLine('Host', d.host), infoLine('Kernel', d.kernel),
    infoLine('Uptime', d.uptime), infoLine('Shell', d.shell), infoLine('Terminal', d.terminal),
    infoLine('CPU', d.cpu), infoLine('Memory', d.memory)
  ];
}

function buildFastfetchHTML(asciiName) {
  var artLines = ASCII_ARTS[asciiName].split('\n');
  var palette = getPalette(asciiName);
  var infoLines = getInfoLines();
  var maxLines = Math.max(artLines.length, infoLines.length);
  var artWidth = 0;
  for (var i = 0; i < artLines.length; i++) {
    var w = stripPlaceholders(artLines[i]).length;
    if (w > artWidth) artWidth = w;
  }
  var html = '';
  for (var j = 0; j < maxLines; j++) {
    var raw = artLines[j] || '';
    var stripped = stripPlaceholders(raw);
    var paddedRaw = raw + new Array(Math.max(0, artWidth - stripped.length) + 1).join(' ');
    var coloredArt = colorizeLogo(paddedRaw, palette);
    var info = infoLines[j] || '';
    html += '<div class="ff-line"><span class="ff-art">' + coloredArt + '</span><span class="ff-info">   ' + info + '</span></div>';
  }
  return html;
}

function buildFastfetchPlainText() {
  var d = state.data;
  var artLines = ASCII_ARTS[state.ascii].split('\n').map(stripPlaceholders);
  var infoLines = [
    d.user + '@' + d.host, '-------------------',
    'OS: ' + d.os, 'Host: ' + d.host, 'Kernel: ' + d.kernel,
    'Uptime: ' + d.uptime, 'Shell: ' + d.shell, 'Terminal: ' + d.terminal,
    'CPU: ' + d.cpu, 'Memory: ' + d.memory
  ];
  var maxLines = Math.max(artLines.length, infoLines.length);
  var artWidth = 0;
  for (var i = 0; i < artLines.length; i++) { if (artLines[i].length > artWidth) artWidth = artLines[i].length; }
  var out = '';
  for (var j = 0; j < maxLines; j++) {
    var a = (artLines[j] || '');
    var pad = new Array(Math.max(0, artWidth - a.length) + 1).join(' ');
    out += (a + pad) + '   ' + (infoLines[j] || '') + '\n';
  }
  return out;
}

commands.sudo = function(args) {
  if (args[0] === 'rm' && args[1] === '-rf' && args[2] === '/') {
    return print('Nice try 😏 Pero este sistema es a prueba de balas.', 'warn');
  }

  if (args[0] !== 'meow') {
    return print('sudo: comando no permitido. Usa "sudo meow <acción>".', 'error');
  }

  var action = args[1];
  var rest = args.slice(2);

  if (!action) {
    print('¿Meow? 🐱 Usa: sudo meow <acción> [args]', 'warn');
    print('Acciones: add, gen, list, status, save, load, presets', 'dim');
    return;
  }

  if (action === 'add') {
    var name = rest[0];
    if (!name) return print('Uso: sudo meow add <nombre|random>', 'error');
    
    if (name === 'random') {
      var keys = Object.keys(ASCII_ARTS);
      name = keys[Math.floor(Math.random() * keys.length)];
      print('¡Aleatorio elegido: ' + name + '!', 'success');
    }
    
    if (!ASCII_ARTS[name]) return print('ASCII "' + name + '" no existe. Prueba list-ascii.', 'error');

    print('[sudo] password for usuario: ********', 'dim');
    print('Descargando ' + name + '...');

    var bar = document.createElement('div');
    bar.className = 'line progress';
    output.appendChild(bar);

    var pct = 0;
    var interval = setInterval(function() {
      pct += 10;
      if (pct > 100) pct = 100;
      var filled = Math.round(pct / 5);
      var empty = 20 - filled;
      var speed = (Math.random() * 4 + 1).toFixed(1);
      bar.textContent = '  [' + new Array(filled+1).join('█') + new Array(empty+1).join('░') + '] ' + Math.round(pct) + '%  ' + speed + ' MB/s';
      window.scrollTo(0, document.body.scrollHeight);
      if (pct >= 100) {
        clearInterval(interval);
        state.ascii = name;
        if (state.installed.indexOf(name) === -1) state.installed.push(name);
        saveState();
        print('✓ ' + name + ' instalado y cargado en la sesión.', 'success');
      }
    }, 40);
    return;
  }

  if (action === 'list') {
    if (state.installed.length === 0) return print('No hay ASCII instalados. Usa: sudo meow add <nombre>', 'warn');
    print('ASCII instalados:', 'dim');
    state.installed.forEach(function(k) {
      var marker = (k === state.ascii) ? ' (activo)' : '';
      print('  • ' + k + marker);
    });
    return;
  }

  if (action === 'status') {
    if (!state.ascii) return print('Ningún ASCII cargado actualmente.', 'warn');
    print('ASCII activo: ' + state.ascii, 'success');
    print('Total instalados: ' + state.installed.length, 'dim');
    return;
  }

  if (action === 'gen') {
    var type = rest[0];
    if (!type) return print('Uso: sudo meow gen <txt|png|pdf>', 'error');
    if (['png','txt','pdf'].indexOf(type) === -1) return print('Formato no válido.', 'error');
    if (!state.ascii) return print('No hay ASCII cargado.', 'error');

    print('[sudo] Generando archivo ' + type.toUpperCase() + '...', 'dim');
    renderPreview();
    
    setTimeout(function() {
      if (type === 'txt') exportTxt();
      if (type === 'png') exportPng();
      if (type === 'pdf') exportPdf();
    }, 300);
    return;
  }

  if (action === 'save') {
    var presetName = rest[0];
    if (!presetName) return print('Uso: sudo meow save <nombre>', 'error');
    state.presets[presetName] = {
      ascii: state.ascii,
      data: JSON.parse(JSON.stringify(state.data)),
      customThemes: JSON.parse(JSON.stringify(state.customThemes))
    };
    saveState();
    print('✓ Preset "' + presetName + '" guardado.', 'success');
    return;
  }

  if (action === 'load') {
    var presetName = rest[0];
    if (!presetName) return print('Uso: sudo meow load <nombre>', 'error');
    if (!state.presets[presetName]) return print('Preset "' + presetName + '" no encontrado.', 'error');
    
    var p = state.presets[presetName];
    state.ascii = p.ascii;
    Object.assign(state.data, p.data);
    state.customThemes = p.customThemes;
    saveState();
    print('✓ Preset "' + presetName + '" cargado (ASCII: ' + p.ascii + ').', 'success');
    return;
  }

  if (action === 'presets') {
    var keys = Object.keys(state.presets);
    if (keys.length === 0) return print('No hay presets guardados. Usa: sudo meow save <nombre>', 'warn');
    print('Presets guardados:', 'dim');
    keys.forEach(function(k) {
      print('  • ' + k + ' (ASCII: ' + state.presets[k].ascii + ')');
    });
    return;
  }

  print('sudo meow: acción "' + action + '" no reconocida.', 'error');
  print('Acciones válidas: add, gen, list, status, save, load, presets', 'dim');
};

function exportTxt() {
  var text = buildFastfetchPlainText();
  downloadBlob(new Blob([text], {type:'text/plain'}), 'fastfetch.txt');
  print('✓ Archivo fastfetch.txt guardado.', 'success');
}
function exportPng() {
  if (typeof html2canvas !== 'function') return print('Error: librería PNG no cargada.', 'error');
  html2canvas(previewBox, { backgroundColor: '#161b22', scale: 2 }).then(function(canvas) {
    canvas.toBlob(function(blob) {
      downloadBlob(blob, 'fastfetch.png');
      print('✓ Archivo fastfetch.png guardado.', 'success');
    });
  }).catch(function(e) {
    print('Error al generar PNG: ' + e.message, 'error');
  });
}
function exportPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) return print('Error: librería PDF no cargada.', 'error');
  var doc = new window.jspdf.jsPDF({ unit:'pt', format:'a4' });
  doc.setFont('courier', 'normal');
  doc.setFontSize(9);
  var text = buildFastfetchPlainText();
  var lines = doc.splitTextToSize(text, 540);
  doc.text(lines, 30, 40);
  doc.save('fastfetch.pdf');
  print('✓ Archivo fastfetch.pdf guardado.', 'success');
}
function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

// NUEVO: Lógica de autocompletado
function autocomplete() {
  var val = input.value;
  var parts = val.split(/\s+/);
  
  // Autocompletado para "sud" -> "sudo"
  if (parts.length === 1) {
    var cmds = Object.keys(commands);
    var matches = cmds.filter(function(c) { return c.indexOf(parts[0]) === 0; });
    if (matches.length === 1) {
      input.value = matches[0] + ' ';
    }
    return;
  }

  // Autocompletado para "sudo meow " -> acciones
  if (parts[0] === 'sudo' && parts[1] === 'meow' && parts.length <= 3) {
    var actions = ['add', 'gen', 'list', 'status', 'save', 'load', 'presets'];
    if (parts.length === 3 && parts[2] !== '') {
      var matches = actions.filter(function(a) { return a.indexOf(parts[2]) === 0; });
      if (matches.length === 1) input.value = 'sudo meow ' + matches[0] + ' ';
    } else if (parts.length === 2 || parts[2] === '') {
      print('Acciones: ' + actions.join(', '), 'dim');
    }
    return;
  }

  // Autocompletado para "sudo meow add " -> ascii names
  if (parts[0] === 'sudo' && parts[1] === 'meow' && parts[2] === 'add' && parts.length <= 4) {
    var keys = Object.keys(ASCII_ARTS);
    if (parts.length === 4 && parts[3] !== '') {
      var matches = keys.filter(function(k) { return k.indexOf(parts[3]) === 0; });
      if (matches.length === 1) input.value = 'sudo meow add ' + matches[0];
    } else {
      print('ASCII: ' + keys.join(', '), 'dim');
    }
    return;
  }

  // Autocompletado para "sudo meow gen " -> formats
  if (parts[0] === 'sudo' && parts[1] === 'meow' && parts[2] === 'gen' && parts.length <= 4) {
    var formats = ['txt', 'png', 'pdf'];
    if (parts.length === 4 && parts[3] !== '') {
      var matches = formats.filter(function(f) { return f.indexOf(parts[3]) === 0; });
      if (matches.length === 1) input.value = 'sudo meow gen ' + matches[0];
    } else {
      print('Formatos: ' + formats.join(', '), 'dim');
    }
    return;
  }
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    autocomplete();
    return;
  }

  if (e.key === 'Enter' || e.keyCode === 13) {
    e.preventDefault();
    var val = input.value;
    input.value = '';
    if (val.trim()) {
      history.push(val.trim());
      histIndex = history.length;
    }
    handleCommand(val);
  }

  // Navegación de historial con flechas (si hay teclado físico)
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIndex > 0) {
      histIndex--;
      input.value = history[histIndex];
    }
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIndex < history.length - 1) {
      histIndex++;
      input.value = history[histIndex];
    } else {
      histIndex = history.length;
      input.value = '';
    }
  }
});

// NUEVO: Botones de historial
document.getElementById('btnUp').addEventListener('click', function(e) {
  e.preventDefault();
  if (histIndex > 0) {
    histIndex--;
    input.value = history[histIndex];
  }
});
document.getElementById('btnDown').addEventListener('click', function(e) {
  e.preventDefault();
  if (histIndex < history.length - 1) {
    histIndex++;
    input.value = history[histIndex];
  } else {
    histIndex = history.length;
    input.value = '';
  }
});

function handleCommand(raw) {
  raw = raw.trim();
  if (!raw) return;
  print('fastfetch@safari:~$ ' + raw);
  var parts = raw.split(/\s+/);
  var cmd = parts[0];
  var args = parts.slice(1);
  
  if (commands[cmd]) {
    try { commands[cmd](args); }
    catch (err) { print('Error: ' + err.message, 'error'); }
  } else {
    print('comando no encontrado: ' + cmd + ". Escribe 'help'.", 'error');
  }
}

document.getElementById('terminal').addEventListener('touchstart', function(e) {
  if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
    setTimeout(function() { input.focus(); }, 50);
  }
}, { passive: true });

document.getElementById('terminal').addEventListener('click', function(e) {
  if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') input.focus();
});
